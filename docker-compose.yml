services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      WASMBOX_DB: /data/wasmbox.db
      WASMBOX_FUEL: "1000000"
      WASMBOX_MEMORY_BYTES: "10485760"
    volumes:
      - wasmbox-data:/data
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  wasmbox-data:
